    flex: 1;
    min-width: 60px;
    accent-color: var(--emerald);
    height: 4px;
    cursor: pointer;

  .time {
    flex: none;
    font: 500 12px/1 var(--font-mono);

    color: var(--text-2);
    min-width: 104px;
    text-align: right;

    top: max(16px, env(safe-area-inset-top, 0px));

    font: 400 11px/1 var(--font-mono);
    color: var(--muted);
    letter-spacing: 0.04em;
    transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1);

    let raf;
    const frame = (now) => {
      const c = clock.current;
      if (c.playing) {
        if (c.last !== null) {
          const prev = c.t;
          c.t = Math.min(DURATION, c.t + Math.min(0.05, (now - c.last) / 1000));
          if (soundRef.current && audio.current) CUES.forEach(([ct, kind]) => { if (prev < ct && c.t >= ct) audio.current.play(kind); });
          if (c.t >= DURATION) { c.playing = false; setPlaying(false); showChrome(); }
        }
        c.last = now;
      } else c.last = null;
      draw();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('600 64px Inter'), document.fonts.load('500 20px "JetBrains Mono"')]).then(draw).catch(() => {});
    return () => cancelAnimationFrame(raf);
  }, [draw]);

  const showChrome = React.useCallback(() => {
    setChrome(true);
    clearTimeout(hideTimer.current);
    hideTimer.current = setTimeout(() => { if (clock.current.playing) setChrome(false); }, 1500);
  }, []);

  const togglePlay = React.useCallback(() => {
    const c = clock.current;
    if (!c.playing && c.t >= DURATION) c.t = 0;
    c.playing = !c.playing; c.last = null;
    setPlaying(c.playing);
    showChrome();
  }, [showChrome]);
  const restart = React.useCallback(() => {
    const c = clock.current; c.t = 0; c.last = null; c.playing = true; setPlaying(true); showChrome();
  }, [showChrome]);
  const toggleSound = React.useCallback(() => {
    const next = !soundRef.current;
    soundRef.current = next; setSound(next);
    if (next) {
      try { if (!audio.current) audio.current = createAudio(); audio.current.ac.resume(); audio.current.play('tick'); } catch (e) { soundRef.current = false; setSound(false); }
    }
  }, []);
  const fullscreen = React.useCallback(() => {
    const el = stageRef.current;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().then(() => setChrome(false)).catch(() => {});
    } catch (e) { /* fullscreen is optional */ }
  }, []);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && e.target.tagName === 'INPUT' && e.key !== ' ' && e.key !== 'h' && e.key !== 'H') return;
      if (e.key === 'h' || e.key === 'H') { clearTimeout(hideTimer.current); setChrome((v) => !v); }
      else if (e.key === 'f' || e.key === 'F') fullscreen();
      else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
      else if (e.key === 'ArrowRight') { clock.current.t = Math.min(DURATION, clock.current.t + (e.shiftKey ? 1 : 1 / 60)); showChrome(); }
      else if (e.key === 'ArrowLeft') { clock.current.t = Math.max(0, clock.current.t - (e.shiftKey ? 1 : 1 / 60)); showChrome(); }
      else if (e.key === 'r' || e.key === 'R') restart();
    };
    window.addEventListener('keydown', onKey);
    showChrome();
    return () => window.removeEventListener('keydown', onKey);
  }, [fullscreen, togglePlay, restart, showChrome]);

  return h('div', { ref: stageRef, className: `stage ${chrome ? '' : 'cinema'}`, onMouseMove: showChrome, onTouchStart: showChrome },
    h('canvas', { ref: canvasRef, onClick: togglePlay, 'aria-label': 'HandTap launch film', role: 'img' }),
    h('div', { className: `hint ${chrome ? '' : 'hidden'}` }, 'SPACE play · H hide · F fullscreen · ← → step'),
    h('div', { className: `chrome ${chrome ? '' : 'hidden'}`, role: 'group', 'aria-label': 'Film controls' },
      h('button', { type: 'button', className: 'btn', onClick: restart, 'aria-label': 'Restart' }, Icon.restart),
      h('button', { type: 'button', className: 'btn', onClick: togglePlay, 'aria-label': playing ? 'Pause' : 'Play' }, playing ? Icon.pause : Icon.play),
      h('input', {
        id: 'scrub', ref: scrubRef, className: 'scrub', type: 'range', min: 0, max: DURATION, step: 1 / 60, defaultValue: 0, 'aria-label': 'Timeline',
        onInput: (e) => { clock.current.t = Number(e.target.value); clock.current.last = null; showChrome(); },
      }),
      h('span', { ref: timeRef, className: 'time' }, `00:00.0 / ${fmt(DURATION)}`),
      h('button', { type: 'button', className: `btn ${sound ? 'on' : ''}`, onClick: toggleSound, 'aria-label': sound ? 'Mute sound' : 'Turn on sound', 'aria-pressed': sound }, sound ? Icon.soundOn : Icon.soundOff),
      h('button', { type: 'button', className: 'btn', onClick: fullscreen, 'aria-label': 'Fullscreen' }, Icon.full),
    ),
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(h(Player));
})();
</script>
</body>
</html>
